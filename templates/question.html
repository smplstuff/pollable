<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>question · pollable</title>
  <meta id="meta-desc" name="description" content="Compare how different AI models answered the same question." />
  <meta name="theme-color" content="#1a1a1a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="pollable" />
  <meta id="og-title" property="og:title" content="question · pollable" />
  <meta id="og-desc" property="og:description" content="Compare how different AI models answered the same question." />
  <meta property="og:url" content="/q" />
  <meta name="twitter:card" content="summary" />
  <meta id="tw-title" name="twitter:title" content="question · pollable" />
  <meta id="tw-desc" name="twitter:description" content="Compare how different AI models answered the same question." />
<script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'oklch(0.2 0 0)',
            foreground: 'oklch(0.96 0.004 260)',
            card: 'oklch(0.235 0 0)',
            primary: 'oklch(0.97 0.004 260)',
            'primary-foreground': 'oklch(0.16 0.006 260)',
            muted: 'oklch(0.22 0 0)',
            'muted-foreground': 'oklch(0.66 0 0)',
            accent: 'oklch(0.27 0 0)',
            highlight: 'oklch(0.72 0.13 235)',
            border: 'oklch(1 0 0 / 9%)',
          },
          fontFamily: { sans: ['Urbanist', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Urbanist', system-ui, sans-serif; }
    .md-body { word-break: break-word; }
    .md-body p { margin: 0.5em 0; }
    .md-body p:first-child { margin-top: 0; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body ul, .md-body ol { margin: 0.5em 0; padding-left: 1.25rem; }
    .md-body li { margin: 0.2em 0; }
    .md-body strong { font-weight: 600; color: oklch(0.98 0.004 260); }
    .md-body a { color: oklch(0.72 0.13 235); text-decoration: underline; text-underline-offset: 2px; }
    .md-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85em;
      background: oklch(1 0 0 / 8%);
      border-radius: 0.3rem;
      padding: 0.1em 0.35em;
    }
    .md-body pre {
      margin: 0.6em 0;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      background: oklch(0.18 0 0);
      border: 1px solid oklch(1 0 0 / 9%);
      overflow-x: auto;
    }
    .md-body pre code {
      background: transparent;
      padding: 0;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .md-body blockquote {
      margin: 0.6em 0;
      padding-left: 0.85rem;
      border-left: 2px solid oklch(0.72 0.13 235 / 50%);
      color: oklch(0.75 0 0);
    }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
      font-weight: 600;
      margin: 0.75em 0 0.35em;
      line-height: 1.3;
    }
    .md-body h1 { font-size: 1.15rem; }
    .md-body h2 { font-size: 1.05rem; }
    .md-body h3 { font-size: 1rem; }
    .md-body hr { border: none; border-top: 1px solid oklch(1 0 0 / 9%); margin: 0.75em 0; }
    .md-body table { border-collapse: collapse; margin: 0.6em 0; width: 100%; font-size: 0.875rem; }
    .md-body th, .md-body td { border: 1px solid oklch(1 0 0 / 9%); padding: 0.35rem 0.5rem; text-align: left; }
    .md-body th { background: oklch(1 0 0 / 5%); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <header class="sticky top-0 z-20 bg-background/80 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center px-6 py-3">
      <a href="/" class="flex items-center gap-2 text-xl font-semibold tracking-tight">
        <span class="h-2.5 w-2.5 rounded-full bg-highlight"></span>
        pollable
      </a>
      <nav class="ml-8 hidden sm:flex gap-5 text-sm text-muted-foreground">
        <a href="/" class="hover:text-foreground transition-colors">Ask</a>
        <a href="/questions" class="hover:text-foreground transition-colors">Questions</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 pt-8 pb-24">
    <nav class="flex items-center gap-2 text-sm text-muted-foreground mb-8">
      <a href="/questions" class="hover:text-foreground transition-colors">Questions</a>
      <svg class="h-3.5 w-3.5 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      <span class="text-foreground">Thread</span>
    </nav>

    <div id="missing" class="hidden text-center py-20">
      <p class="text-muted-foreground">Question not found.</p>
      <a href="/questions" class="mt-4 inline-block text-sm text-highlight hover:underline">Back to questions</a>
    </div>

    <p id="loading" class="text-sm text-muted-foreground">Loading…</p>

    <article id="thread" class="hidden">
      <h1 id="q-title" class="text-2xl md:text-3xl font-semibold tracking-tight leading-snug"></h1>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-muted-foreground">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
        <span id="q-date"></span>
        <span class="opacity-40">·</span>
        <span id="q-count"></span>
      </div>

      <div class="mt-8 flex flex-wrap gap-2">
        <a id="ask-again" href="/" class="inline-flex items-center gap-1.5 rounded-full bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:opacity-85 transition-opacity">
          Ask again
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
        <a href="/questions" class="inline-flex items-center gap-1.5 rounded-full border border-border px-4 py-2 text-sm font-medium hover:bg-accent transition-colors">All questions</a>
      </div>

      <section class="mt-12">
        <h2 class="text-lg font-semibold mb-4">Model answers</h2>
        <div id="answers" class="space-y-3"></div>
      </section>
    </article>
  </main>

  <script>
    
    function renderMarkdown(text) {
      if (typeof marked === 'undefined') {
        const d = document.createElement('div');
        d.className = 'md-body text-sm leading-relaxed text-foreground/90';
        d.style.whiteSpace = 'pre-wrap';
        d.textContent = text || '';
        return d.outerHTML;
      }
      marked.setOptions({ breaks: true, gfm: true });
      const html = marked.parse(text || '');
      return `<div class="md-body text-sm leading-relaxed text-foreground/90">${html}</div>`;
    }

    const id = new URLSearchParams(location.search).get('id');

    (async () => {
      const loading = document.getElementById('loading');
      const missing = document.getElementById('missing');
      const thread = document.getElementById('thread');

      if (!id) {
        loading.classList.add('hidden');
        missing.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/questions/' + encodeURIComponent(id));
        if (!res.ok) {
          loading.classList.add('hidden');
          missing.classList.remove('hidden');
          return;
        }
        const item = await res.json();
        loading.classList.add('hidden');
        thread.classList.remove('hidden');

        const qTitle = (item.question || 'question').trim();
        const short = qTitle.length > 70 ? qTitle.slice(0, 67) + '…' : qTitle;
        const pageTitle = short + ' · pollable';
        const pageDesc = qTitle.length > 160 ? qTitle.slice(0, 157) + '…' : (qTitle || 'Compare model answers on pollable.');
        document.title = pageTitle;
        const setMeta = (id, attr, val) => { const el = document.getElementById(id); if (el) el.setAttribute(attr, val); };
        setMeta('meta-desc', 'content', pageDesc);
        setMeta('og-title', 'content', pageTitle);
        setMeta('og-desc', 'content', pageDesc);
        setMeta('tw-title', 'content', pageTitle);
        setMeta('tw-desc', 'content', pageDesc);
        document.getElementById('q-title').textContent = item.question || '';
        document.getElementById('q-date').textContent = item.at ? new Date(item.at).toLocaleString() : '';
        const answers = item.answers || [];
        document.getElementById('q-count').textContent = answers.length + ' answers';
        document.getElementById('ask-again').href = '/?q=' + encodeURIComponent(item.question || '');

        document.getElementById('answers').innerHTML = answers.length
          ? answers.map(a => `
            <div class="rounded-xl border border-border bg-card p-5">
              <div class="flex items-center gap-2 mb-3">
                <img src="https://unpkg.com/@lobehub/icons-static-png@latest/dark/${a.icon || 'openai'}.png" class="h-6 w-6 object-contain" alt="" onerror="this.style.display='none'" />
                <div>
                  <div class="text-sm font-medium">${a.name || a.model}</div>
                  <div class="text-[10px] font-mono text-muted-foreground">${a.model || ''}</div>
                </div>
                ${a.ok === false ? `<span class="ml-auto inline-flex items-center gap-1 rounded-full border border-red-500/30 bg-red-500/10 px-2 py-0.5 text-[11px] font-medium text-red-400 shrink-0">
                  <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  failed
                </span>` : ''}
              </div>
              ${a.ok === false && !(a.text || '').trim() ? '' : renderMarkdown(a.text || '')}
            </div>`).join('')
          : '<p class="text-sm text-muted-foreground">No answers stored for this question.</p>';
      } catch {
        loading.textContent = 'Could not load this question.';
      }
    })();
  </script>
</body>
</html>
