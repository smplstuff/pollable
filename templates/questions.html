<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>questions · pollable</title>
  <meta name="description" content="Previous questions asked by people. See how different models answered." />
  <meta name="theme-color" content="#1a1a1a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="pollable" />
  <meta property="og:title" content="questions · pollable" />
  <meta property="og:description" content="Previous questions asked by people. See how different models answered." />
  <meta property="og:url" content="/questions" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="questions · pollable" />
  <meta name="twitter:description" content="Previous questions asked by people. See how different models answered." />
<script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'oklch(0.2 0 0)',
            foreground: 'oklch(0.96 0.004 260)',
            card: 'oklch(0.235 0 0)',
            primary: 'oklch(0.97 0.004 260)',
            'primary-foreground': 'oklch(0.16 0.006 260)',
            muted: 'oklch(0.22 0 0)',
            'muted-foreground': 'oklch(0.66 0 0)',
            accent: 'oklch(0.27 0 0)',
            highlight: 'oklch(0.72 0.13 235)',
            border: 'oklch(1 0 0 / 9%)',
          },
          fontFamily: { sans: ['Urbanist', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Urbanist', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <header class="sticky top-0 z-20 bg-background/80 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center px-6 py-3">
      <a href="/" class="flex items-center gap-2 text-xl font-semibold tracking-tight">
        <span class="h-2.5 w-2.5 rounded-full bg-highlight"></span>
        pollable
      </a>
      <nav class="ml-8 hidden sm:flex gap-5 text-sm text-muted-foreground">
        <a href="/" class="hover:text-foreground transition-colors">Ask</a>
        <a href="/questions" class="text-foreground font-medium">Questions</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 pt-12 pb-24">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight">Previous questions asked by people</h1>
      <p class="mt-1 text-sm text-muted-foreground">Open any question to see how each model answered.</p>
    </div>

    <div id="list" class="mt-8 space-y-3"></div>
    <p id="empty" class="mt-16 text-center text-sm text-muted-foreground">Loading…</p>
  </main>

  <script>
    async function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      try {
        const res = await fetch('/api/questions');
        const data = await res.json();
        const items = data.questions || [];
        if (!items.length) {
          list.innerHTML = '';
          empty.innerHTML = 'No questions yet. <a href="/" class="text-highlight hover:underline">Ask the first one</a>';
          return;
        }
        empty.classList.add('hidden');
        list.innerHTML = items.map(item => {
          const preview = item.preview || [];
          const icons = preview.slice(0, 6).map(a =>
            `<img src="https://unpkg.com/@lobehub/icons-static-png@latest/dark/${a.icon || 'openai'}.png" class="h-4 w-4 object-contain rounded-full ring-2 ring-card bg-card" alt="" onerror="this.style.display='none'" />`
          ).join('');
          const extra = (item.answerCount || 0) > 6 ? `<span class="relative z-10 flex h-4 w-4 items-center justify-center rounded-full bg-accent text-[9px] ring-2 ring-card">+${item.answerCount - 6}</span>` : '';
          return `
            <a href="/q?id=${encodeURIComponent(item.id)}" class="group block rounded-xl border border-border bg-card px-5 py-4 hover:bg-accent transition-colors">
              <div class="text-[15px] font-medium leading-snug group-hover:underline group-hover:underline-offset-2">${item.question}</div>
              <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-muted-foreground">
                <span class="inline-flex items-center -space-x-1.5">${icons}${extra}</span>
                <span class="opacity-40">·</span>
                <span>${item.answerCount || 0} answers</span>
                <span class="opacity-40">·</span>
                <span>${item.at ? new Date(item.at).toLocaleString() : ''}</span>
              </div>
            </a>`;
        }).join('');
      } catch {
        empty.textContent = 'Could not load questions from the server.';
      }
    }
    render();
  </script>
</body>
</html>
